name: Monitoramento público

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar API, frontend e CORS
        env:
          API_URL: https://planner-api-tvmg.onrender.com
          FRONTEND_URL: https://avanade-frontend-xi.vercel.app
        run: bash scripts/operacao/verificar-publicacao.sh
