name: ValidaÃ§Ã£o do Planner Comercial
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify dependency:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
      - name: Consultar alertas OSV (relatório, não aceite de segurança)
        continue-on-error: true
        run: python3 ../scripts/auditar-dependencias.py --maven-tree target/dependency-tree.json --output target/auditoria-osv.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-dependencias-backend
          path: backend/target/auditoria-osv.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-backend
          path: backend/target/surefire-reports
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug :app:inventariarDependencias
      - name: Consultar alertas OSV Android
        continue-on-error: true
        run: python3 ../scripts/auditar-dependencias.py --gradle-list app/build/reports/dependencias-resolvidas.txt --output app/build/reports/auditoria-osv.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-android
          path: |
            android-pos/app/build/reports
            android-pos/app/build/outputs/apk/debug/app-debug.apk

  docker-restauracao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configurar credenciais descartÃ¡veis
        shell: bash
        run: |
          for key in DEMO_PASSWORD MIGRATION_PASSWORD DATABASE_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Validar Docker, reinÃ­cio e restauraÃ§Ã£o
        run: bash backend/scripts/verificar-docker-e-restauracao.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-docker-restauracao
          path: backend/.local/resultado-docker-restauracao.json

  hospedagem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Credenciais descartaveis
        shell: bash
        run: |
          for key in DEMO_PASSWORD MIGRATION_PASSWORD DATABASE_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Validar pacote de hospedagem sem publicar dominio
        run: bash scripts/hospedagem/verificar.sh
