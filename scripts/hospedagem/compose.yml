services:
  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile.hospedagem
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Informe o dominio HTTPS}
    ports:
      - "${WEB_HTTP_BIND:-0.0.0.0:80}:80"
      - "${WEB_HTTPS_BIND:-0.0.0.0:443}:443"
    volumes:
      - certificados:/data
      - configuracao_proxy:/config
    networks:
      privada:
        ipv4_address: 172.30.19.10
    restart: unless-stopped
  api:
    build: ../../backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Informe a URL JDBC}
      DATABASE_USER: ${DATABASE_USER:-split_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure a senha de runtime}
      MIGRATION_USER: ${MIGRATION_USER:-split_owner}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Configure a senha de migration}
      APP_DEMO_SEED: "true"
      APP_DEMO_PASSWORD: ${DEMO_PASSWORD:?Configure a senha demonstrativa}
      API_DOCS_ENABLED: "false"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Informe a origem HTTPS}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: '172\.30\.19\.10'
      MANAGEMENT_SERVER_PORT: "9090"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
    networks: [privada]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9090/actuator/health]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 10
  db:
    profiles: [banco-local]
    image: postgres:17.11
    environment:
      POSTGRES_DB: split
      POSTGRES_USER: split_owner
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?Configure a senha de migration}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure a senha de runtime}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ../../backend/docker/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    networks: [privada]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U split_owner -d split]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
networks:
  privada:
    ipam:
      config:
        - subnet: 172.30.19.0/24
volumes:
  dados_postgres:
  certificados:
  configuracao_proxy:
