services:
  - type: web
    name: planner-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: API_DOCS_ENABLED
        value: "false"
      - key: DEMO_SEED_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: MIGRATION_URL
        sync: false
      - key: MIGRATION_USER
        sync: false
      - key: MIGRATION_PASSWORD
        sync: false
      - key: SUPABASE_SSL_ROOT_CERT
        value: /etc/secrets/supabase-ca.crt
      - key: CORS_ORIGINS
        sync: false
