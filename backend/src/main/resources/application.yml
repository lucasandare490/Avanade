spring:
  application:
    name: split-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/split}
    username: ${DATABASE_USER:split_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      connection-init-sql: SET statement_timeout = '10s'
  flyway:
    user: ${MIGRATION_USER:split_owner}
    password: ${MIGRATION_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 16KB
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db
springdoc:
  remove-broken-reference-definitions: false
  api-docs.version: OPENAPI_3_0
  api-docs.enabled: ${API_DOCS_ENABLED:false}
  swagger-ui.enabled: ${API_DOCS_ENABLED:false}
app:
  cors-origins: ${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  session-minutes: 60
  password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
  password-reset-dev-token: ${PASSWORD_RESET_DEV_TOKEN:false}
  password-reset-link-base: ${PASSWORD_RESET_LINK_BASE:}
  password-reset-from: ${PASSWORD_RESET_FROM:}
  login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
  login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:20}
  # Cabeçalho de IP sobrescrito por um proxy confiável. Vazio = IP da conexão (sem proxy na frente).
  client-ip-header: ${CLIENT_IP_HEADER:}
  credit:
    partner: ${CREDIT_PARTNER:simulado}
    simulated-monthly-rate-bp: ${CREDIT_SIMULATED_MONTHLY_RATE_BP:249}
    simulated-bank-monthly-rate-bp: ${CREDIT_SIMULATED_BANK_MONTHLY_RATE_BP:189}
    webhook-secret: ${CREDIT_WEBHOOK_SECRET:}
  demo-seed: ${DEMO_SEED_ENABLED:false}
  demo-password: ${DEMO_PASSWORD:}
  mock-payment: CONFIRMED
  mock-fail-parcel: NONE

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.jdbc: INFO
    org.hibernate: INFO
