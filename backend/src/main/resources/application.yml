spring:
  application:
    name: split-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/split}
    username: ${DATABASE_USER:split_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      connection-init-sql: SET statement_timeout = '10s'
  flyway:
    user: ${MIGRATION_USER:split_owner}
    password: ${MIGRATION_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 16KB
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
springdoc:
  remove-broken-reference-definitions: false
  api-docs.version: OPENAPI_3_0
  api-docs.enabled: ${API_DOCS_ENABLED:false}
  swagger-ui.enabled: ${API_DOCS_ENABLED:false}
app:
  cors-origins: ${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  session-minutes: 60
  demo-seed: ${DEMO_SEED_ENABLED:false}
  demo-password: ${DEMO_PASSWORD:}
  mock-payment: CONFIRMED
  mock-fail-parcel: NONE

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.jdbc: INFO
    org.hibernate: INFO
