services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: split
      POSTGRES_USER: split_owner
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?Configure MIGRATION_PASSWORD}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U split_owner -d split']
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports: ['127.0.0.1:8080:8080']
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://db:5432/split
      DATABASE_USER: split_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD}
      MIGRATION_USER: split_owner
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Configure MIGRATION_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Configure DEMO_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
